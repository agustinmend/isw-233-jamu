<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Portafolio</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="main.js" defer type="module"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    </head>
    <body>
        <nav-encabezado></nav-encabezado>
        <main id="app-root"></main>
        <vista-piedepagina></vista-piedepagina>
        <template id="tpl-encabezado">
            <div class="encabezado">
                <a href="/" class="encabezado__titulo" data-link>Inicio</a>
                <a href="/sobremi" class="encabezado__titulo" data-link>Sobre mí</a>
                <a href="/habilidades" class="encabezado__titulo" data-link>Habilidades</a>
                <a href="/proyectos" class="encabezado__titulo" data-link>Proyectos</a>
                <a href="/blog" class="encabezado__titulo" data-link>Blogs</a>
                <a href="/contacto" class="encabezado__titulo" data-link>Contacto</a>
            </div>
        </template>

        <template id="tpl-inicio">
            <div id="inicio" class="principal">
                <h1 class="principal__carrera">Estudiante Ingenieria de software</h1>
                <h2 class="principal__nombre">Jose Agustin Mendoza Ureña</h2>
            </div>
        </template>

        <template id="tpl-sobre-mi">
            <div id="sobre-mi" class="marco">
                <div class="sobre-mi">
                    <img src="Imagenes" class="sobre-mi__imagen">
                    <h2 class="sobre-mi__encabezado">Sobre mí</h2>
                    <h3 class="sobre-mi__saludo">Soy Agustin,un gusto saludarte</h3>
                    <p class="sobre-mi__presentacion">Desde pequeño siempre me a gustado resolver problemas complejos que conlleven razonamiento logico, he tenido el privilegio de ganar beca en la UCB en la cual actualmente sigo estudiando. Soy una persona tranquila, con gusto por el trabajo en equipo y me gusta desarrollar nuevas habilidades.</p>
                </div>
            </div>
        </template>

        <template id="tpl-habilidades">
            <div id="habilidades" class="habilidades">
                <h2 class="habilidades__encabezado">Habilidades</h2>
                <div class="habilidades__segmentos">
                    <div class="habilidades__segmento">
                        <div class="habilidades__segmento--icono">
                            <i class="fa-solid fa-code"></i>
                        </div>
                        <div class="habilidades__segmento--encabezado-1">
                            <h3>Desarrollador frontend</h3>
                        </div>
                        <div class="habilidades__segmento--texto">
                            <p>Experiencia basica en desarrollo de frontend, conocimiento basico en herramientas de frontend</p>
                        </div>
                        <div class="habilidades__segmento--encabezado-2">
                            <h4>herramientas de desarrollo</h4>
                        </div>
                        <div class="habilidades__segmento--herramientas">
                            <ul>
                                <li>Angular</li>
                                <li>React</li>
                            </ul>
                        </div>
                    </div>
                    <div class="habilidades__segmento">
                        <div class="habilidades__segmento--icono">
                            <i class="fa-solid fa-server"></i>
                        </div>
                        <div class="habilidades__segmento--encabezado-1">
                            <h3>Desarrollador Backend</h3>
                        </div>
                        <div class="habilidades__segmento--texto">
                            <p>Experiencia basica en desarrollo de Backend, conocimiento de conceptos basicos</p>
                        </div>
                        <div class="habilidades__segmento--encabezado-2">
                            <h4>herramientas de desarrollo</h4>
                        </div>
                        <div class="habilidades__segmento--herramientas">
                            <ul>
                                <li>.Net</li>
                                <li>Node.js</li>
                                <li>Python</li>
                                <li>SQL</li>
                                <li>MongoDB</li>
                            </ul>
                        </div>
                    </div>
                    <div class="habilidades__segmento">
                        <div class="habilidades__segmento--icono">
                            <i class="fa-solid fa-screwdriver-wrench"></i>
                        </div>
                        <div class="habilidades__segmento--encabezado-1">
                            <h3>Otras habilidades</h3>
                        </div>
                        <div class="habilidades__segmento--texto">
                            <p>Poseo habilidades extras como buen trabajo en equipo y manejo de otras herramientas</p>
                        </div>
                        <div class="habilidades__segmento--encabezado-2">
                            <h4>herramientas que uso</h4>
                        </div>
                        <div class="habilidades__segmento--herramientas">
                            <ul>
                                <li>Miro</li>
                                <li>Git</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <template id="tpl-proyectos">
            <div id="proyectos" class="proyectos">
                <h2 class="proyectos__encabezado">Proyectos</h2>
                <p class="proyectos__comentario">Aqui tienes algunos proyectos en los que he trabajado</p>
                <div class="mostrar-proyectos" id="tablero-proyectos"></div>
                <div id="centinela-proyectos" style="height: 10px; width: 100%;"></div>
            </div>
        </template>
        <template id="tpl-proyecto-card">
            <div class="proyectos__presentacion">
                <img src="" class="proyectos__presentacion--imagen">
                <p class="proyectos__presentacion--texto"></p>
            </div>
        </template>
        
        <template id="tpl-blogs">
            <div id="blogs" class="blog">
                <h2 class="blog__encabezado">Blog</h2>
                <p id="contador-blog" class="blog__Contador"></p>
                <div class="blog__filtros">
                    <button data-filtro="todos">Todos</button>
                    <button data-filtro="desarrollo">Desarrollo</button>
                    <button data-filtro="diseno">DiseñO</button>
                    <button data-filtro="favoritos">Favoritos</button>
                </div>
                <div class="blog__publicacion" data-id="post-1" data-categoria="desarrollo">
                    <h3 class="blog__publicacion--titulo">Mejores practicas en desarrollo de Software</h3>
                    <p class="blog__publicacion--fecha">15 de Enero, 2026</p>
                    <p class="blog__publicacion--texto">En este articulo señalo cuales son las buenas practicas que uno debe seguir al momento de desarrollar su sistema para mantener su codigo limpio y escalable</p>
                    <button class="blog__favorito">Marcar Favorito</button>
                </div>
                <div class="blog__publicacion" data-id="post-2" data-categoria="diseno">
                    <h3 class="blog__publicacion--titulo">Errores comunes al iniciar Figma</h3>
                    <p class="blog__publicacion--fecha">15 de Enero, 2026</p>
                    <p class="blog__publicacion--texto">En este articulo señalo y dejo el ejemplo claro de cosas que no se deben realizar cuando se esta iniciando en Figma</p>
                    <button class="blog__favorito">Marcar Favorito</button>
                </div>
                <div class="blog__publicacion" data-id="post-3" data-categoria="desarrollo">
                    <h3 class="blog__publicacion--titulo">Mi experiencia aprendiendo POO</h3>
                    <p class="blog__publicacion--fecha">15 de Enero, 2026</p>
                    <p class="blog__publicacion--texto">En este apartado dejo escrito lo sufrido en carne propia al momento de entender y aplicar los conceptos de POO</p>
                    <button class="blog__favorito">Marcar Favorito</button>
                </div>
            </div>
        </template>

        <template id="tpl-contacto">
            <div id="contacto" class="contacto">
                <h2 class="contacto__encabezado">Contacto</h2>
                <div class="contacto__formulario">
                    <form>
                        <div class="contacto__formulario--texto">Nombre</div>
                        <input type="text" placeholder="escribe tu nombre" class="contacto__formulario--entrada">
                        <div class="contacto__formulario--texto">Email</div>
                        <input type="email" placeholder="ingresa tu email" class="contacto__formulario--entrada">
                        <div class="contacto__formulario--texto">Mensaje</div>
                        <textarea placeholder="Deja tu mensaje" class="contacto__formulario--mensaje" rows="5"></textarea>
                        <button type="submit" class="contacto__formulario--enviar">Enviar</button>
                    </form>
                </div>
            </div>
        </template>

        <template id="tpl-pie-de-pagina">
            <div class="pie-de-pag">
                <div class="pie-de-pag__redes-sociales">
                    <a href="https://www.linkedin.com/in/jos%C3%A9-agust%C3%ADn-mendoza-ure%C3%B1a/" class="pie-de-pag__redes-sociales__red-social" target="_blank">
                        <i class="fa-brands fa-linkedin"></i>LinkedIn
                    </a>
                    <a href="https://github.com/agustinmend" class="pie-de-pag__redes-sociales__red-social" target="_blank">
                        <i class="fa-brands fa-github"></i>Github
                    </a>
                </div>
                <p>© 2026 Jose Agustin Mendoza Ureña. Todos los derechos reservados.</p>
            </div>
        </template>

    </body>
</html>
